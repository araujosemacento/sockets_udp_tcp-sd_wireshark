<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sockets TCP | UDP</title>
    <style>
        pre {
            background-color: #ccc;
            border-radius: 7px;
            padding: 12px;
        }
    </style>
</head>

<body>
    <h3>Sockets do Cliente</h3>

    <!-- Switch pra escolher o protocolo -->
    <label><input type="radio" name="p" value="tcp" checked> TCP</label>
    <label><input type="radio" name="p" value="udp"> UDP</label>

    <br><br>

    <!-- Switch pra desligar os servidores -->
    <label><input type="checkbox" id="desligado"> Desligar servidores</label>

    <br><br>

    <!-- Input do valor em BRL -->
    <label for="valor">R$:</label><br>
    <input type="number" id="valor" placeholder="Ex: 100" step="any" onkeydown="if (event.key === 'Enter') enviar();">

    <!-- Select das moedas -->
    <select id="moeda">
        <option value="USD">🇺🇸 USD</option>
        <option value="EUR">🇪🇺 EUR</option>
        <option value="GBP">🇬🇧 GBP</option>
        <option value="JPY">🇯🇵 JPY</option>
        <option value="CAD">🇨🇦 CAD</option>
        <option value="AUD">🇦🇺 AUD</option>
        <option value="CNY">🇨🇳 CNY</option>
        <option value="ARS">🇦🇷 ARS</option>
        <option value="INR">🇮🇳 INR</option>
        <option value="KRW">🇰🇷 KRW</option>
        <option value="MXN">🇲🇽 MXN</option>
        <option value="RUB">🇷🇺 RUB</option>
        <option value="SAR">🇸🇦 SAR</option>
        <option value="TRY">🇹🇷 TRY</option>
        <option value="ZAR">🇿🇦 ZAR</option>
        <option value="IDR">🇮🇩 IDR</option>
    </select>

    <button onclick="enviar()">Enviar</button>

    <h4>Histórico de Respostas:</h4>
    <pre id="log"></pre>

    <script>
        async function enviar() {
            const valor = document.getElementById('valor').value;
            const moeda = document.getElementById('moeda').value;
            const proto = document.querySelector('input[name="p"]:checked').value;
            const off = document.getElementById('desligado').checked;

            if (!valor) return;

            const msg = `${valor} ${moeda}`;

            // Envia a requisição ao servidor selecionado
            const res = await fetch(`/send?proto=${proto}&msg=${encodeURIComponent(msg)}&off=${off}`);
            const texto = await res.text();

            // Adiciona a resposta ao log
            document.getElementById('log').textContent += texto + '\n';

            // Limpa o input
            document.getElementById('valor').value = '';
        }
    </script>
</body>

</html>
